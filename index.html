<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeWall</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #08090f;
    color: white;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px 16px 50px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
}

.logo span {
    color: #ff4f91;
}

.badge {
    background: #151722;
    border: 1px solid #292c3a;
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 12px;
    color: #aaa;
}

/* HERO */

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 42px;
    line-height: 1.05;
    margin-bottom: 18px;
}

.hero h1 span {
    color: #ff4f91;
}

.hero p {
    color: #85899a;
    font-size: 16px;
    line-height: 1.6;
}

/* SECTION */

.section {
    background: #11131c;
    border: 1px solid #242735;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 15px;
}

/* ADMIN */

.admin-box {
    display: none;
}

input[type="file"] {
    width: 100%;
    padding: 14px;
    background: #090a10;
    border: 1px solid #292c3a;
    border-radius: 14px;
    color: white;
    margin-bottom: 12px;
}

input[type="text"] {
    width: 100%;
    padding: 14px;
    background: #090a10;
    border: 1px solid #292c3a;
    border-radius: 14px;
    color: white;
    outline: none;
    margin-bottom: 12px;
}

.primary-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    color: white;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
}

/* WALLPAPER */

.wallpaper-card {
    background: #151722;
    border: 1px solid #292c3a;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 18px;
}

.wallpaper-preview {
    width: 100%;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #090a10;
    position: relative;
}

.wallpaper-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* MOTION */

.motion {
    animation: slowZoom 8s ease-in-out infinite alternate;
}

@keyframes slowZoom {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }

}

.wallpaper-info {
    padding: 15px;
}

.wallpaper-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 12px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.wall-btn {
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid #292c3a;
    background: #1a1c27;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.wall-btn.live {
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    border: none;
}

.download {
    width: 100%;
    margin-top: 9px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #08090f;
    font-weight: 800;
    cursor: pointer;
}

/* LIVE VIEW */

.live-view {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.live-view img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: liveMotion 7s ease-in-out infinite alternate;
}

@keyframes liveMotion {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1.10) translateX(-1%);
    }

}

.live-controls {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
}

.live-controls button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-weight: 800;
}

.close-btn {
    background: #222530;
    color: white;
}

.set-live-btn {
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    color: white;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #666b7c;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

/* ADMIN BUTTON */

.admin-toggle {
    text-align: center;
    margin-top: 25px;
}

.admin-toggle button {
    background: transparent;
    border: 1px solid #292c3a;
    color: #777;
    border-radius: 20px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 11px;
}

.status {
    text-align: center;
    color: #888;
    margin-top: 10px;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Anime<span>Wall</span>
        </div>

        <div class="badge">
            WALLPAPER
        </div>

    </div>


    <!-- HERO -->

    <div class="hero">

        <h1>
            Anime <span>Wallpapers</span>
        </h1>

        <p>
            Beautiful anime wallpapers with cinematic motion.
        </p>

    </div>


    <!-- ADMIN -->

    <div class="section admin-box" id="adminBox">

        <div class="section-title">
            👑 Admin Upload
        </div>

        <input
            type="text"
            id="wallpaperTitle"
            placeholder="Wallpaper title"
        >

        <input
            type="file"
            id="wallpaperFile"
            accept="image/*"
        >

        <button
            class="primary-btn"
            onclick="uploadWallpaper()"
        >
            📤 Publish Wallpaper
        </button>

        <div
            class="status"
            id="adminStatus"
        ></div>

    </div>


    <!-- WALLPAPERS -->

    <div class="section">

        <div class="section-title">
            🔥 Latest Wallpapers
        </div>

        <div id="wallpaperList">

            <div class="empty">

                <div class="empty-icon">
                    🖼️
                </div>

                No wallpapers yet.

            </div>

        </div>

    </div>


    <!-- ADMIN TOGGLE -->

    <div class="admin-toggle">

        <button onclick="toggleAdmin()">
            Admin Panel
        </button>

    </div>

</div>


<!-- LIVE VIEW -->

<div
    class="live-view"
    id="liveView"
>

    <img
        id="liveImage"
        src=""
        alt="Live Wallpaper"
    >

    <div class="live-controls">

        <button
            class="close-btn"
            onclick="closeLive()"
        >
            ✕ Close
        </button>

        <button
            class="set-live-btn"
            onclick="setLiveWallpaper()"
        >
            ✨ Set Live Wallpaper
        </button>

    </div>

</div>


<script>

/* =========================
   WALLPAPER STORAGE
========================= */

let wallpapers =
    JSON.parse(
        localStorage.getItem("animeWallpapers") || "[]"
    );


/* =========================
   SHOW WALLPAPERS
========================= */

function renderWallpapers() {

    const list =
        document.getElementById("wallpaperList");

    if (wallpapers.length === 0) {

        list.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🖼️
                </div>

                No wallpapers yet.

            </div>
        `;

        return;
    }


    list.innerHTML = "";


    wallpapers.forEach((wallpaper, index) => {

        const card =
            document.createElement("div");

        card.className =
            "wallpaper-card";


        card.innerHTML = `

            <div class="wallpaper-preview">

                <img
                    src="${wallpaper.image}"
                    alt="${wallpaper.title}"
                >

            </div>


            <div class="wallpaper-info">

                <div class="wallpaper-title">
                    ${wallpaper.title}
                </div>


                <div class="buttons">

                    <button
                        class="wall-btn"
                        onclick="setNormal(${index}, 'home')"
                    >
                        🏠 Home
                    </button>

                    <button
                        class="wall-btn"
                        onclick="setNormal(${index}, 'lock')"
                    >
                        🔒 Lock
                    </button>

                    <button
                        class="wall-btn"
                        onclick="setNormal(${index}, 'both')"
                    >
                        🏠🔒 Both
                    </button>

                    <button
                        class="wall-btn live"
                        onclick="openLive(${index})"
                    >
                        ✨ LIVE
                    </button>

                </div>


                <button
                    class="download"
                    onclick="downloadWallpaper(${index})"
                >
                    ⬇️ Download Wallpaper
                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


/* =========================
   ADMIN PANEL
========================= */

function toggleAdmin() {

    const box =
        document.getElementById("adminBox");

    if (box.style.display === "block") {

        box.style.display = "none";

    } else {

        box.style.display = "block";

    }

}


/* =========================
   UPLOAD
========================= */

function uploadWallpaper() {

    const file =
        document.getElementById("wallpaperFile")
        .files[0];

    const title =
        document.getElementById("wallpaperTitle")
        .value.trim();

    const status =
        document.getElementById("adminStatus");


    if (!file) {

        status.innerText =
            "❌ Select an image first.";

        return;

    }


    if (!title) {

        status.innerText =
            "❌ Enter wallpaper title.";

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        wallpapers.unshift({

            title: title,

            image: event.target.result,

            createdAt: Date.now()

        });


        localStorage.setItem(
            "animeWallpapers",
            JSON.stringify(wallpapers)
        );


        document.getElementById(
            "wallpaperTitle"
        ).value = "";


        document.getElementById(
            "wallpaperFile"
        ).value = "";


        status.innerText =
            "✅ Wallpaper published!";


        renderWallpapers();

    };


    reader.readAsDataURL(file);

}


/* =========================
   NORMAL WALLPAPER
========================= */

function setNormal(index, type) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    /*
       Website cannot directly change
       Android Home/Lock wallpaper.

       Android APK will connect these
       buttons to WallpaperManager.
    */

    alert(
        "📱 " +
        type.toUpperCase() +
        " WALLPAPER\n\n" +
        "Android app version-il direct wallpaper setting connect cheyyum."
    );

}


/* =========================
   LIVE PREVIEW
========================= */

function openLive(index) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    const liveView =
        document.getElementById("liveView");

    const liveImage =
        document.getElementById("liveImage");


    liveImage.src =
        wallpaper.image;


    liveView.style.display =
        "flex";

}


/* =========================
   CLOSE LIVE
========================= */

function closeLive() {

    document.getElementById(
        "liveView"
    ).style.display = "none";

}


/* =========================
   SET LIVE
========================= */

function setLiveWallpaper() {

    /*
       Actual Android Live Wallpaper
       will be connected later using
       Android WallpaperService.
    */

    alert(
        "✨ Live Wallpaper\n\n" +
        "Android APK version-il ee motion wallpaper direct Live Wallpaper aayi set cheyyum."
    );

}


/* =========================
   DOWNLOAD
========================= */

function downloadWallpaper(index) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    const link =
        document.createElement("a");


    link.href =
        wallpaper.image;


    link.download =
        wallpaper.title
            .replace(/[^a-z0-9]/gi, "-")
            .toLowerCase() +
        ".jpg";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


/* =========================
   START
========================= */

renderWallpapers();

</script>

</body>
        </html>
