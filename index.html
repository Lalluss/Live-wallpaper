<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AnimeWall</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #08090f;
    color: white;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px 16px 50px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
}

.logo span {
    color: #ff4f91;
}

.badge {
    background: #151722;
    border: 1px solid #292c3a;
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 12px;
    color: #aaa;
}

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 42px;
    line-height: 1.05;
    margin-bottom: 18px;
}

.hero h1 span {
    color: #ff4f91;
}

.hero p {
    color: #85899a;
    font-size: 16px;
    line-height: 1.6;
}

.section {
    background: #11131c;
    border: 1px solid #242735;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 15px;
}

.admin-box {
    display: none;
}

input[type="file"],
input[type="text"] {
    width: 100%;
    padding: 14px;
    background: #090a10;
    border: 1px solid #292c3a;
    border-radius: 14px;
    color: white;
    margin-bottom: 12px;
}

input[type="text"] {
    outline: none;
}

.primary-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    color: white;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
}

.primary-btn:disabled {
    opacity: 0.5;
}

.wallpaper-card {
    background: #151722;
    border: 1px solid #292c3a;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 18px;
}

.wallpaper-preview {
    width: 100%;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #090a10;
    position: relative;
}

.wallpaper-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.wallpaper-info {
    padding: 15px;
}

.wallpaper-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 12px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.wall-btn {
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid #292c3a;
    background: #1a1c27;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.wall-btn.live {
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    border: none;
}

.download {
    width: 100%;
    margin-top: 9px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #08090f;
    font-weight: 800;
    cursor: pointer;
}

.live-view {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.live-view img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: liveMotion 7s ease-in-out infinite alternate;
}

@keyframes liveMotion {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1.10) translateX(-1%);
    }

}

.live-controls {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
}

.live-controls button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-weight: 800;
}

.close-btn {
    background: #222530;
    color: white;
}

.set-live-btn {
    background: linear-gradient(135deg, #ff4f91, #9657ff);
    color: white;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #666b7c;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.admin-toggle {
    text-align: center;
    margin-top: 25px;
}

.admin-toggle button {
    background: transparent;
    border: 1px solid #292c3a;
    color: #777;
    border-radius: 20px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 11px;
}

.status {
    text-align: center;
    color: #888;
    margin-top: 10px;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 35px;
    color: #777;
}

</style>

</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            Anime<span>Wall</span>
        </div>

        <div class="badge">
            WALLPAPER
        </div>

    </div>


    <div class="hero">

        <h1>
            Anime <span>Wallpapers</span>
        </h1>

        <p>
            Beautiful anime wallpapers with cinematic motion.
        </p>

    </div>


    <div
        class="section admin-box"
        id="adminBox"
    >

        <div class="section-title">
            👑 Admin Upload
        </div>

        <input
            type="text"
            id="wallpaperTitle"
            placeholder="Wallpaper title"
        >

        <input
            type="file"
            id="wallpaperFile"
            accept="image/*"
        >

        <button
            class="primary-btn"
            id="uploadButton"
            onclick="uploadWallpaper()"
        >
            📤 Publish Wallpaper
        </button>

        <button
            type="button"
            onclick="logoutAdmin()"
            style="
                width:100%;
                margin-top:12px;
                padding:14px;
                border-radius:14px;
                border:1px solid #333;
                background:#171923;
                color:white;
                font-size:16px;
                font-weight:700;
            "
        >
            🚪 Logout Admin
        </button>

        <div
            class="status"
            id="adminStatus"
        ></div>

    </div>


    <div class="section">

        <div class="section-title">
            🔥 Latest Wallpapers
        </div>

        <div id="wallpaperList">

            <div class="loading">
                Loading wallpapers...
            </div>

        </div>

    </div>


    <div class="admin-toggle">

        <button type="button" onclick="toggleAdmin()">
            Admin Panel
        </button>

    </div>

</div>


<div
    class="live-view"
    id="liveView"
>

    <img
        id="liveImage"
        src=""
        alt="Live Wallpaper"
    >

    <div class="live-controls">

        <button
            class="close-btn"
            onclick="closeLive()"
        >
            ✕ Close
        </button>

        <button
            class="set-live-btn"
            onclick="setLiveWallpaper()"
        >
            ✨ Set Live Wallpaper
        </button>

    </div>

</div>


<script>

let wallpapers = [];


/* =========================
   LOAD ONLINE WALLPAPERS
========================= */

async function loadWallpapers() {

    const list =
        document.getElementById("wallpaperList");

    try {

        const response =
            await fetch("/api/wallpapers");

        if (!response.ok) {
            throw new Error("Failed to load");
        }

        const data =
            await response.json();

        wallpapers =
            data.wallpapers || [];

        renderWallpapers();

    } catch (error) {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ⚠️
                </div>

                Failed to load wallpapers.

                <br><br>

                Refresh the page and try again.
            </div>
        `;

    }

}


/* =========================
   RENDER WALLPAPERS
========================= */

function renderWallpapers() {

    const list =
        document.getElementById("wallpaperList");

    if (wallpapers.length === 0) {

        list.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🖼️
                </div>

                No wallpapers yet.

            </div>
        `;

        return;
    }


    list.innerHTML = "";


    wallpapers.forEach(
        (wallpaper, index) => {

            const card =
                document.createElement("div");

            card.className =
                "wallpaper-card";


            card.innerHTML = `

                <div class="wallpaper-preview">

                    <img
                        src="${escapeHtml(wallpaper.image)}"
                        alt="${escapeHtml(wallpaper.title)}"
                    >

                </div>


                <div class="wallpaper-info">

                    <div class="wallpaper-title">
                        ${escapeHtml(wallpaper.title)}
                    </div>


                    <div class="buttons">

                        <button
                            class="wall-btn"
                            onclick="setNormal(${index}, 'home')"
                        >
                            🏠 Home
                        </button>


                        <button
                            class="wall-btn"
                            onclick="setNormal(${index}, 'lock')"
                        >
                            🔒 Lock
                        </button>


                        <button
                            class="wall-btn"
                            onclick="setNormal(${index}, 'both')"
                        >
                            🏠🔒 Both
                        </button>


                        <button
                            class="wall-btn live"
                            onclick="openLive(${index})"
                        >
                            ✨ LIVE
                        </button>

                    </div>


                    <button
                        class="download"
                        onclick="downloadWallpaper(${index})"
                    >
                        ⬇️ Download Wallpaper
                    </button>

                </div>

            `;


            list.appendChild(card);

        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ADMIN PANEL
========================= */

async function toggleAdmin() {

    const box = document.getElementById("adminBox");

    const password = prompt("🔐 Enter Admin Password");

    if (!password) {
        return;
    }

    try {

        const response = await fetch(
            "/api/admin-login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            alert(
                "❌ " +
                (data.error || "Wrong password")
            );

            return;
        }

        if (data.success) {

            box.style.display = "block";

            alert("✅ Admin login successful!");

        }

    } catch (error) {

        console.error(error);

        alert(
            "❌ Login failed. Please try again."
        );

    }
    }
/* =========================
   UPLOAD WALLPAPER
========================= */

async function uploadWallpaper() {

    const file =
        document.getElementById("wallpaperFile")
        .files[0];


    const title =
        document.getElementById("wallpaperTitle")
        .value
        .trim();


    const status =
        document.getElementById("adminStatus");


    const button =
        document.getElementById("uploadButton");


    if (!file) {

        status.innerText =
            "❌ Select an image first.";

        return;

    }


    if (!title) {

        status.innerText =
            "❌ Enter wallpaper title.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ Uploading...";

    status.innerText =
        "Uploading wallpaper...";


    try {

        const image =
            await fileToDataURL(file);


        const response =
            await fetch(
                "/api/wallpapers",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        title: title,
                        image: image
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Upload failed"
            );

        }


        status.innerText =
            "✅ Wallpaper published!";


        document.getElementById(
            "wallpaperTitle"
        ).value = "";


        document.getElementById(
            "wallpaperFile"
        ).value = "";


        await loadWallpapers();


    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ " + error.message;

    }


    button.disabled = false;

    button.innerText =
        "📤 Publish Wallpaper";

}


/* =========================
   FILE → BASE64
========================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = () => {

                resolve(
                    reader.result
                );

            };


            reader.onerror = reject;


            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   NORMAL WALLPAPER
========================= */

function setNormal(index, type) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    alert(
        "📱 " +
        type.toUpperCase() +
        " WALLPAPER\n\n" +
        "Android APK version-il direct wallpaper setting connect cheyyum."
    );

}


/* =========================
   LIVE PREVIEW
========================= */

function openLive(index) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    const liveView =
        document.getElementById("liveView");


    const liveImage =
        document.getElementById("liveImage");


    liveImage.src =
        wallpaper.image;


    liveView.style.display =
        "flex";

}


/* =========================
   CLOSE LIVE
========================= */

function closeLive() {

    document.getElementById(
        "liveView"
    ).style.display = "none";

}


/* =========================
   SET LIVE
========================= */

function setLiveWallpaper() {

    alert(
        "✨ Live Wallpaper\n\n" +
        "Android APK version-il ee motion wallpaper direct Live Wallpaper aayi set cheyyum."
    );

}


/* =========================
   DOWNLOAD
========================= */

async function downloadWallpaper(index) {

    const wallpaper =
        wallpapers[index];


    if (!wallpaper) return;


    try {

        const response =
            await fetch(wallpaper.image);


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;


        link.download =
            wallpaper.title
                .replace(
                    /[^a-z0-9]/gi,
                    "-"
                )
                .toLowerCase() +
            ".jpg";


        document.body.appendChild(link);


        link.click();


        document.body.removeChild(link);


        URL.revokeObjectURL(url);


    } catch (error) {

        window.open(
            wallpaper.image,
            "_blank"
        );

    }

}


/* =========================
   START
========================= */

loadWallpapers();

</script>

</body>
</html>
