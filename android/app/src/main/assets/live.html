<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const image =
    new Image();

image.crossOrigin = "anonymous";

const params =
    new URLSearchParams(
        window.location.search
    );

const imageUrl =
    params.get("image");

let imageLoaded = false;

let screenWidth = 0;
let screenHeight = 0;

let imageWidth = 0;
let imageHeight = 0;

let scale = 1;
let drawWidth = 0;
let drawHeight = 0;
let offsetX = 0;
let offsetY = 0;

let startTime =
    performance.now();


/* ==========================================
   RESIZE
   ========================================== */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    screenWidth =
        window.innerWidth;

    screenHeight =
        window.innerHeight;

    canvas.width =
        screenWidth * dpr;

    canvas.height =
        screenHeight * dpr;

    canvas.style.width =
        screenWidth + "px";

    canvas.style.height =
        screenHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    calculateImage();
}


window.addEventListener(
    "resize",
    resize
);


/* ==========================================
   IMAGE COVER CALCULATION
   ========================================== */

function calculateImage() {

    if (!imageLoaded) {
        return;
    }

    imageWidth =
        image.naturalWidth;

    imageHeight =
        image.naturalHeight;

    scale =
        Math.max(
            screenWidth / imageWidth,
            screenHeight / imageHeight
        );

    drawWidth =
        imageWidth * scale;

    drawHeight =
        imageHeight * scale;

    /*
     * IMPORTANT:
     *
     * No continuous right movement.
     *
     * Image stays centered.
     */

    offsetX =
        (screenWidth - drawWidth) / 2;

    offsetY =
        (screenHeight - drawHeight) / 2;
}


/* ==========================================
   DRAW NORMAL IMAGE
   ========================================== */

function drawBase() {

    ctx.drawImage(
        image,
        offsetX,
        offsetY,
        drawWidth,
        drawHeight
    );
}


/* ==========================================
   LOCAL WAVE EFFECT
   ========================================== */

function waveRegion(
    x,
    y,
    width,
    height,
    strength,
    speed,
    time
) {

    /*
     * Convert region from screen coordinates.
     */

    const sliceHeight = 8;

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        width,
        height
    );

    ctx.clip();

    /*
     * Redraw small horizontal slices
     * with different tiny offsets.
     */

    for (
        let sy = 0;
        sy < height;
        sy += sliceHeight
    ) {

        const wave =
            Math.sin(
                time * speed +
                sy * 0.035
            );

        const movement =
            wave * strength;

        /*
         * Source position.
         */

        const sourceY =
            (y - offsetY) / scale
            +
            sy / scale;

        const sourceHeight =
            sliceHeight / scale;

        if (
            sourceY < 0 ||
            sourceY >= imageHeight
        ) {
            continue;
        }

        ctx.drawImage(
            image,

            0,
            sourceY,
            imageWidth,
            sourceHeight,

            offsetX + movement,
            y + sy,
            drawWidth,
            sliceHeight
        );
    }

    ctx.restore();
}


/* ==========================================
   VERY SOFT LOCAL MOVEMENT
   ========================================== */

function softRegion(
    x,
    y,
    width,
    height,
    strength,
    speed,
    time
) {

    const sliceHeight = 12;

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        width,
        height
    );

    ctx.clip();

    for (
        let sy = 0;
        sy < height;
        sy += sliceHeight
    ) {

        const wave =
            Math.sin(
                time * speed +
                sy * 0.018
            );

        const movement =
            wave * strength;

        const sourceY =
            (y - offsetY) / scale
            +
            sy / scale;

        const sourceHeight =
            sliceHeight / scale;

        if (
            sourceY < 0 ||
            sourceY >= imageHeight
        ) {
            continue;
        }

        ctx.drawImage(
            image,

            0,
            sourceY,
            imageWidth,
            sourceHeight,

            offsetX + movement,
            y + sy,
            drawWidth,
            sliceHeight
        );
    }

    ctx.restore();
}


/* ==========================================
   GOLDEN / LIGHT PULSE
   ========================================== */

function drawGlow(time) {

    /*
     * Very subtle.
     */

    const pulse =
        (
            Math.sin(time * 1.2)
            + 1
        ) / 2;

    const alpha =
        0.025 +
        pulse * 0.035;

    const gradient =
        ctx.createRadialGradient(
            screenWidth * 0.5,
            screenHeight * 0.65,
            0,

            screenWidth * 0.5,
            screenHeight * 0.65,
            screenWidth * 0.55
        );

    gradient.addColorStop(
        0,
        `rgba(255,190,60,${alpha})`
    );

    gradient.addColorStop(
        0.55,
        `rgba(255,100,20,${alpha * 0.35})`
    );

    gradient.addColorStop(
        1,
        "rgba(255,80,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );
}


/* ==========================================
   SMALL FLOATING PARTICLES
   ========================================== */

const particles = [];

for (let i = 0; i < 24; i++) {

    particles.push({

        x: Math.random(),

        y: Math.random(),

        size:
            1 +
            Math.random() * 2,

        speed:
            0.15 +
            Math.random() * 0.35,

        phase:
            Math.random() * Math.PI * 2
    });
}


function drawParticles(time) {

    ctx.save();

    for (const p of particles) {

        const x =
            p.x * screenWidth
            +
            Math.sin(
                time * p.speed +
                p.phase
            ) * 5;

        const y =
            p.y * screenHeight
            +
            Math.cos(
                time * p.speed +
                p.phase
            ) * 8;

        ctx.fillStyle =
            "rgba(255,210,120,0.35)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* ==========================================
   MAIN ANIMATION
   ========================================== */

function animate(now) {

    if (!imageLoaded) {

        requestAnimationFrame(
            animate
        );

        return;
    }

    const time =
        (now - startTime) / 1000;

    /*
     * Clear.
     */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    /*
     * BASE IMAGE
     *
     * Completely stable.
     */

    drawBase();


    /*
     * ======================================
     * SKY / CLOUD AREA
     * ======================================
     *
     * Very tiny horizontal wave.
     *
     * Top ~40% of screen.
     */

    waveRegion(
        0,
        screenHeight * 0.04,
        screenWidth,
        screenHeight * 0.38,

        1.5,
        0.45,
        time
    );


    /*
     * ======================================
     * CLOTH / CHARACTER AREA
     * ======================================
     *
     * Extremely subtle.
     */

    softRegion(
        screenWidth * 0.18,
        screenHeight * 0.43,
        screenWidth * 0.64,
        screenHeight * 0.35,

        0.8,
        0.55,
        time
    );


    /*
     * ======================================
     * LOWER ATMOSPHERE
     * ======================================
     */

    softRegion(
        0,
        screenHeight * 0.72,
        screenWidth,
        screenHeight * 0.20,

        0.7,
        0.35,
        time
    );


    /*
     * Glow.
     */

    drawGlow(time);


    /*
     * Floating particles.
     */

    drawParticles(time);


    requestAnimationFrame(
        animate
    );
}


/* ==========================================
   LOAD IMAGE
   ========================================== */

if (imageUrl) {

    image.onload = function () {

        imageLoaded = true;

        calculateImage();

        startTime =
            performance.now();

        requestAnimationFrame(
            animate
        );
    };

    image.onerror = function () {

        ctx.fillStyle =
            "#000";

        ctx.fillRect(
            0,
            0,
            screenWidth,
            screenHeight
        );
    };

    image.src =
        imageUrl;
}


/* Initial size */

resize();

</script>

</body>
</html>
